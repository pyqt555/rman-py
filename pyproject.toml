[build-system]
requires =["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "rman_py"
version = "0.1.0"
requires-python = ">=3.8"

[tool.scikit-build]
cmake.build-type = "Release"
cmake.args = ["-DCMAKE_POLICY_VERSION_MINIMUM=3.5"]

install.components = [""]
build-dir = "build"
logging.level = "INFO"